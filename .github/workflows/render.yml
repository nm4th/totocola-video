name: render

on:
  push:
    branches: ["**"]
    paths:
      - "compositions/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition project directory"
        required: false
        default: "compositions/main"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          ffmpeg -version | head -1
          fc-list :lang=ja | head -5

      - name: Install npm deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Hyperframes CLI diagnostics
        run: |
          npx --yes hyperframes@latest --version || true
          npx --yes hyperframes@latest --help || true
          npx --yes hyperframes@latest render --help || true

      - name: Render MP4
        env:
          COMPOSITION: ${{ github.event.inputs.composition || 'compositions/main' }}
        run: |
          mkdir -p output
          npx --yes hyperframes@latest render "$COMPOSITION" --output output/main.mp4

      - name: Show output info
        run: ls -lah output/ && file output/main.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.sha }}
          path: output/main.mp4
          if-no-files-found: error
          retention-days: 30
