<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>totocola intro</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0d12;
        color: #f5f7fa;
        font-family:
          "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(
          circle at 30% 30%,
          #1f3a8a 0%,
          #0b0d12 70%
        );
        overflow: hidden;
      }

      .clip {
        position: absolute;
        opacity: 0;
        animation-fill-mode: forwards;
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fade-out {
        to {
          opacity: 0;
        }
      }

      .title {
        top: 420px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 132px;
        font-weight: 800;
        letter-spacing: 0.04em;
        animation:
          fade-up 0.8s forwards,
          fade-out 0.6s forwards 4.2s;
      }

      .subtitle {
        top: 600px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 48px;
        font-weight: 400;
        color: #9aa7c2;
        animation:
          fade-up 0.8s forwards 0.4s,
          fade-out 0.6s forwards 4.2s;
      }

      .logo {
        top: 760px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 36px;
        color: #4ade80;
        letter-spacing: 0.4em;
        animation: fade-up 0.8s forwards 1s;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="totocola-intro"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-duration="5"
    >
      <h1 class="clip title" data-start="0" data-duration="5" data-track-index="0">
        totocola
      </h1>
      <p class="clip subtitle" data-start="0.4" data-duration="4.6" data-track-index="1">
        HeyGen HyperFrames で動画をコードから生成する
      </p>
      <p class="clip logo" data-start="1" data-duration="4" data-track-index="2">
        ▍ HYPERFRAMES
      </p>
    </div>
  </body>
</html>
